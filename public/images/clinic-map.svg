<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="mapBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2EFE7"/>
      <stop offset="100%" stop-color="#E5DEC9"/>
    </linearGradient>
    <linearGradient id="lakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3B18A" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7B936B" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="mapShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#303832" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Map Canvas -->
  <rect width="600" height="380" rx="16" fill="url(#mapBg)"/>

  <!-- Subtle Street Grid Lines -->
  <g stroke="#DCD5C4" stroke-width="1.2" opacity="0.8">
    <line x1="40" y1="0" x2="40" y2="380"/>
    <line x1="120" y1="0" x2="120" y2="380"/>
    <line x1="220" y1="0" x2="220" y2="380"/>
    <line x1="340" y1="0" x2="340" y2="380"/>
    <line x1="460" y1="0" x2="460" y2="380"/>
    <line x1="540" y1="0" x2="540" y2="380"/>
    
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="140" x2="600" y2="140"/>
    <line x1="0" y1="220" x2="600" y2="220"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
  </g>

  <!-- Rajsamand Lake Contour (Famous Local Geographic Feature) -->
  <path d="M 400 0 C 440 60 480 100 520 90 C 560 80 600 120 600 160 L 600 0 Z" fill="url(#lakeGrad)" stroke="#A3B18A" stroke-width="2"/>
  <text x="470" y="55" font-family="'DM Sans', sans-serif" font-size="11" font-weight="600" fill="#355D48" opacity="0.85">
    RAJSAMAND LAKE
  </text>

  <!-- Major Highway NH 58 Arterial Route -->
  <path d="M 0 280 C 180 260 280 200 450 140 L 600 110" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <path d="M 0 280 C 180 260 280 200 450 140 L 600 110" fill="none" stroke="#B9A77D" stroke-width="4" stroke-dasharray="8 6"/>
  
  <text x="70" y="295" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#796638">
    NH 58 (To Udaipur &amp; Nathdwara)
  </text>

  <!-- Secondary City Arteries -->
  <path d="M 280 0 L 280 200 L 200 380" fill="none" stroke="#FFFFFF" stroke-width="8"/>
  <path d="M 120 140 L 450 140" fill="none" stroke="#FFFFFF" stroke-width="6"/>

  <!-- Landmark Points -->
  <circle cx="160" cy="140" r="5" fill="#A3B18A"/>
  <text x="140" y="165" font-family="'DM Sans', sans-serif" font-size="10" font-weight="500" fill="#57635A">
    Kankroli Bus Stand
  </text>

  <circle cx="430" cy="190" r="5" fill="#A3B18A"/>
  <text x="390" y="215" font-family="'DM Sans', sans-serif" font-size="10" font-weight="500" fill="#57635A">
    Old Town Rajsamand
  </text>

  <!-- Ekansh Clinic Location Pin (Heart of Rajsamand) -->
  <g transform="translate(280, 160)" filter="url(#mapShadow)">
    <!-- Pulse Ring Animation -->
    <circle cx="0" cy="0" r="32" fill="#355D48" fill-opacity="0.15"/>
    <circle cx="0" cy="0" r="20" fill="#A3B18A" fill-opacity="0.35"/>
    
    <!-- Map Marker Pin -->
    <path d="M 0 -36 C -14 -36 -24 -26 -24 -12 C -24 6 0 24 0 24 C 0 24 24 6 24 -12 C 24 -26 14 -36 0 -36 Z" fill="#355D48" stroke="#FFFFFF" stroke-width="2.5"/>
    <circle cx="0" cy="-14" r="8" fill="#FFFFFF"/>
    <circle cx="0" cy="-14" r="4" fill="#B9A77D"/>
  </g>

  <!-- Location Label Callout Box -->
  <g transform="translate(180, 80)" filter="url(#mapShadow)">
    <rect width="200" height="52" rx="10" fill="#FFFFFF" stroke="#355D48" stroke-width="1.5"/>
    <text x="14" y="22" font-family="'Playfair Display', serif" font-size="13" font-weight="700" fill="#355D48">
      Ekansh Homoeopathic
    </text>
    <text x="14" y="38" font-family="'DM Sans', sans-serif" font-size="10" font-weight="600" fill="#A3B18A">
      RAJ SAMAND, RAJASTHAN
    </text>
  </g>
</svg>
